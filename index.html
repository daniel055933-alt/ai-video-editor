<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D News - Professional Broadcast Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Padauk:wght@400;700&display=swap');
        
        body {
            font-family: 'Padauk', sans-serif;
            background-color: #0f172a; 
            color: #e2e8f0;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        }
        .video-container {
            width: 100%;
            max-width: 420px; 
            margin: 0 auto;
            position: relative;
        }
        canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 9 / 16; 
            background-color: #020617;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: block;
        }
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ef4444; 
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        .loader-small { width: 14px; height: 14px; border-width: 2px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .logo-font { font-family: 'Montserrat', sans-serif; }
        
        .news-logo-box {
            background-color: #cc0000;
            color: white;
            padding: 0.1rem 0.5rem;
            line-height: 1;
        }
        
        #progressTrack { cursor: pointer; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 flex flex-col items-center">

    <div class="w-full max-w-6xl flex flex-col gap-6">
        
        <!-- Header -->
        <header class="w-full flex flex-col md:flex-row items-center justify-between pb-4 border-b border-slate-700/80 gap-4">
            <div class="flex items-center gap-1 cursor-pointer shrink-0 mx-auto md:mx-0">
                <div class="news-logo-box font-black text-3xl md:text-4xl logo-font tracking-tighter">D</div>
                <div class="text-white font-black text-3xl md:text-4xl logo-font tracking-tighter ml-1">NEWS</div>
            </div>
            <div class="text-slate-400 text-sm font-semibold uppercase tracking-widest mx-auto md:mx-0">
                <i class="fa-solid fa-satellite-dish text-red-500 mr-2"></i> Broadcast Studio
            </div>
        </header>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
            
            <!-- Panel 1: Generate -->
            <div class="lg:col-span-5 glass-panel p-5 flex flex-col gap-4 h-fit">
                <h2 class="text-base md:text-lg font-bold text-red-500 border-b border-slate-700 pb-2 uppercase tracking-wide">
                    <i class="fa-solid fa-tower-broadcast mr-2"></i> 1. Prepare Broadcast
                </h2>
                
                <div>
                    <label class="text-xs text-slate-400 font-semibold mb-1 block uppercase">Broadcast Language</label>
                    <div class="flex items-center bg-slate-800 p-2.5 rounded border border-slate-600 shadow-inner">
                        <div class="px-2 text-red-400"><i class="fa-solid fa-language"></i></div>
                        <select id="languageSelect" class="bg-transparent text-white text-sm font-semibold focus:outline-none cursor-pointer w-full">
                            <option value="Burmese">မြန်မာ (Myanmar)</option>
                            <option value="English">English</option>
                            <option value="Korean">한국어 (Korean)</option>
                            <option value="Japanese">日本語 (Japanese)</option>
                            <option value="Thai">ภาษาไทย (Thai)</option>
                        </select>
                    </div>
                </div>

                <p class="text-xs text-slate-400 leading-relaxed mt-1">
                    <i class="fa-solid fa-circle-info text-blue-400 mr-1"></i> ကမ္ဘာအရေး၊ နည်းပညာ၊ အားကစား၊ စမတ်ဖုန်း၊ ငွေကြေး သတင်း ၅ ပုဒ်ကို အသေးစိတ် အလိုအလျောက် ရှာဖွေတင်ဆက်ပေးပါမည်။
                </p>

                <button id="btnGenerate" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-4 rounded transition-all flex items-center justify-center gap-2 shadow-lg uppercase tracking-wider text-sm mt-2">
                    <i class="fa-solid fa-satellite-dish"></i> Generate In-depth News
                </button>

                <!-- Status -->
                <div id="statusContainer" class="hidden p-4 bg-slate-900 rounded border border-red-500/30 shadow-inner mt-2">
                    <div class="flex items-center gap-2 text-red-400 text-sm font-semibold mb-2">
                        <div class="loader" id="statusLoader"></div> <span id="statusText">Starting Studio...</span>
                    </div>
                    <div class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                        <div id="generationProgress" class="bg-red-500 h-full w-0 transition-all shadow-[0_0_8px_#ef4444]"></div>
                    </div>
                    <p id="errorLog" class="text-xs text-red-400 mt-3 hidden bg-red-950/80 p-3 rounded font-mono break-words leading-relaxed border border-red-800"></p>
                </div>
            </div>

            <!-- Panel 2: Video Player -->
            <div class="lg:col-span-7 glass-panel p-5 flex flex-col items-center">
                <h2 class="text-base md:text-lg font-bold mb-4 text-emerald-400 border-b border-slate-700 pb-2 w-full text-left uppercase tracking-wide">
                    <i class="fa-solid fa-circle-play mr-2"></i> 2. Player & Auto-Record
                </h2>
                
                <div class="video-container flex-grow flex items-center justify-center mb-4">
                    <canvas id="videoCanvas" width="720" height="1280"></canvas>
                    
                    <div id="canvasOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 z-10 rounded border border-slate-700 backdrop-blur-sm">
                        <div class="w-16 h-16 bg-red-900/30 rounded-full flex items-center justify-center mb-4 border border-red-500/30">
                            <i class="fa-solid fa-video-slash text-2xl text-red-500"></i>
                        </div>
                        <p class="text-slate-300 text-sm font-semibold uppercase tracking-widest">Studio Standby</p>
                    </div>
                </div>

                <!-- Record Settings & Play Buttons -->
                <div class="w-full bg-slate-900 p-4 rounded border border-slate-700 shadow-inner">
                    
                    <div class="flex items-center justify-between mb-4">
                        <label class="text-xs text-slate-400 font-bold uppercase tracking-wider">Export Res (MP4):</label>
                        <select id="resolutionSelect" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white focus:outline-none text-xs font-mono">
                            <option value="1920">1080x1920 (FHD)</option>
                            <option value="1280" selected>720x1280 (HD)</option>
                            <option value="854">480x854 (SD)</option>
                        </select>
                    </div>

                    <div class="flex flex-col items-center justify-center gap-4">
                        <div class="w-full flex items-center justify-between">
                            <span class="text-xs text-red-400 font-mono font-bold" id="timeCurrent">00:00</span>
                            <div class="w-full mx-3 bg-slate-800 h-1.5 rounded-full overflow-hidden relative" id="progressTrack">
                                <div id="playbackProgress" class="bg-red-600 h-full w-0 shadow-[0_0_8px_#dc2626] absolute top-0 left-0 pointer-events-none"></div>
                            </div>
                            <span class="text-xs text-slate-500 font-mono" id="timeTotal">00:00</span>
                        </div>

                        <!-- Buttons -->
                        <div class="w-full flex flex-col sm:flex-row items-center gap-2">
                            <button id="btnPlayOnly" class="w-full sm:w-2/5 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-3 rounded transition-all flex items-center justify-center gap-2 shadow-lg disabled:opacity-30 disabled:cursor-not-allowed uppercase tracking-wider text-xs" disabled>
                                <i class="fa-solid fa-play fa-lg" id="playIcon"></i> <span id="playText">Play Video</span>
                            </button>
                            <button id="btnStop" class="w-full sm:w-1/5 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-3 rounded transition-all flex items-center justify-center gap-2 shadow-lg disabled:opacity-30 disabled:cursor-not-allowed uppercase tracking-wider text-xs" disabled>
                                <i class="fa-solid fa-stop fa-lg"></i> Stop
                            </button>
                            <button id="btnPlayAndRecord" class="w-full sm:w-2/5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-3 rounded transition-all flex items-center justify-center gap-2 shadow-lg disabled:opacity-30 disabled:cursor-not-allowed uppercase tracking-wider text-xs" disabled>
                                <i class="fa-solid fa-record-vinyl fa-lg"></i> Play & Save
                            </button>
                        </div>
                    </div>

                    <div id="recordingStatus" class="hidden mt-3 p-3 bg-red-900/20 rounded border border-red-500/30 text-center">
                        <div class="loader loader-small border-red-500/40 border-l-red-500 mb-2"></div>
                        <p class="text-red-400 text-xs font-bold uppercase tracking-widest animate-pulse" id="recordingText">● Recording Broadcast</p>
                        <p class="text-[10px] text-slate-400 mt-1">Please wait until the end of the broadcast.</p>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <audio id="audioPlayer" class="hidden" crossorigin="anonymous"></audio>

    <script>
        // ==== Environment Configuration ====
        const apiKey = ""; // Handled automatically by the execution environment
        const modelName = 'gemini-2.5-flash-preview-09-2025'; 
        
        // ==== UI Elements ====
        const btnGenerate = document.getElementById('btnGenerate');
        const languageSelect = document.getElementById('languageSelect');
        const resolutionSelect = document.getElementById('resolutionSelect');
        const btnPlayOnly = document.getElementById('btnPlayOnly');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const btnStop = document.getElementById('btnStop');
        const btnPlayAndRecord = document.getElementById('btnPlayAndRecord');
        const progressTrack = document.getElementById('progressTrack');
        const errorLog = document.getElementById('errorLog');

        // Date String
        const now = new Date();
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
        const currentDateStr = now.toLocaleDateString('en-US', dateOptions);

        // ==== SUPER ROBUST FETCH WITH EXPONENTIAL BACKOFF ====
        async function fetchWithRetry(urlBase, payload, maxRetries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000]; 
            
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const url = `${urlBase}?key=${apiKey}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (res.ok) return res;
                    
                    if (i === maxRetries - 1) {
                        const errText = await res.text();
                        throw new Error(`API Error (${res.status}): ${errText}`);
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw new Error(error.message || `အင်တာနက်ချိတ်ဆက်မှု ပြဿနာ ဖြစ်ပွားနေပါသည်။ (Connection Error)`);
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        // ==== STATE VARIABLES ====
        let newsItems = [];
        let isGenerating = false;
        let currentNewsIndex = 0;
        let isPlaying = false;
        let animationFrameId;
        let canvasContext = document.getElementById('videoCanvas').getContext('2d');
        let totalDuration = 0;
        let anchorImageObj = null;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let audioContext, analyzer, dataArray;

        const femaleAnchorStyles = [
            "A cinematic beautiful female news anchor broadcasting live, modern news desk, glowing screens in background, highly detailed professional photography",
            "A serious professional female news reporter looking directly at camera, CNN TV studio background, 4k resolution"
        ];
        
        // ==== 2. GENERATION WORKFLOW ====
        btnGenerate.addEventListener('click', async () => {
            if (isGenerating) return;
            
            const targetLang = languageSelect.value;
            
            isGenerating = true; newsItems = []; anchorImageObj = null;
            btnGenerate.disabled = true; 
            btnPlayOnly.disabled = true; btnStop.disabled = true; btnPlayAndRecord.disabled = true;
            
            document.getElementById('statusContainer').classList.remove('hidden');
            errorLog.classList.add('hidden');
            stopPlayback();
            
            try {
                updateStatus('Preparing Studio Background...', 5);
                try {
                    const avatarBase64 = await fetchImage(femaleAnchorStyles[Math.floor(Math.random() * femaleAnchorStyles.length)]);
                    if(avatarBase64) {
                        anchorImageObj = new Image(); anchorImageObj.crossOrigin = "anonymous";
                        await new Promise(r => { anchorImageObj.onload = r; anchorImageObj.src = avatarBase64; });
                    }
                } catch(e) { console.warn("Avatar failed."); }

                updateStatus(`Analyzing 5 Global News Topics...`, 15);
                await fetchNewsWithRobustParsing(targetLang, modelName);

                for (let i = 0; i < newsItems.length; i++) {
                    updateStatus(`Generating Natural Voice (${i+1}/${newsItems.length})...`, 25 + ((i+1)/newsItems.length * 60));
                    const fullText = newsItems[i].headline + "။ " + newsItems[i].paragraphs.join(" ");
                    newsItems[i].audioUrl = await fetchAudio(fullText, targetLang);
                }

                let hasAudio = false;
                for(let item of newsItems) if(item.audioUrl) hasAudio = true;
                if (!hasAudio) throw new Error("အသံဖိုင် လုံးဝ ဖန်တီး၍ မရပါ။ API Error ဖြစ်နိုင်ပါသည်။");

                updateStatus('Syncing Teleprompter...', 90);
                await setupDurationsAndSubtitles();
                
                updateStatus('Ready to Broadcast!', 100);
                setTimeout(() => document.getElementById('statusContainer').classList.add('hidden'), 2000);
                
                document.getElementById('canvasOverlay').classList.add('hidden');
                
                btnPlayOnly.disabled = false;
                btnStop.disabled = false;
                btnPlayAndRecord.disabled = false;
                
                currentNewsIndex = 0;
                drawCanvasFrame(0);

            } catch (error) {
                updateStatus('Generation Failed.', 0, true);
                showErrorLog(error.message);
            } finally {
                isGenerating = false; btnGenerate.disabled = false;
            }
        });

        function updateStatus(text, percent, isError = false) {
            document.getElementById('statusText').innerText = text;
            document.getElementById('generationProgress').style.width = `${percent}%`;
            if (isError) {
                document.getElementById('statusText').classList.replace('text-red-400', 'text-slate-400');
                document.getElementById('generationProgress').classList.replace('bg-red-500', 'bg-slate-500');
            } else {
                document.getElementById('statusText').classList.replace('text-slate-400', 'text-red-400');
                document.getElementById('generationProgress').classList.replace('bg-slate-500', 'bg-red-500');
            }
        }
        function showErrorLog(msg) { 
            errorLog.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2 text-lg"></i> <br>${msg.replace(/\n/g, '<br>')}`; 
            errorLog.classList.remove('hidden'); 
        }

        // ==== ROBUST TEXT PARSING (Exact Greeting, 5 Topics) ====
        async function fetchNewsWithRobustParsing(language, modelName) {
            
            let greeting = "";
            if (language === "Burmese") {
                greeting = "မင်္ဂလာပါ။";
            } else if (language === "English") {
                greeting = "Hello.";
            } else if (language === "Thai") {
                greeting = "สวัสดีค่ะ";
            } else if (language === "Korean") {
                greeting = "안녕하세요.";
            } else if (language === "Japanese") {
                greeting = "こんにちは。";
            } else {
                greeting = "Hello.";
            }

            const prompt = `Act as an expert, engaging international female news anchor. Date: ${currentDateStr}.
            Provide a broadcast of EXACTLY 5 DIFFERENT global news events in this order:
            1. ကမ္ဘာအရေး (World News)
            2. နည်းပညာ (Technology)
            3. အားကစား (Sports)
            4. စမတ်ဖုန်းသတင်း (Smartphone News)
            5. ငွေကြေးသတင်း (Finance News)
            
            Language MUST be STRICTLY: ${language}.
            
            CRITICAL RULES:
            - Keep it brief. Provide exactly 2 short paragraphs per story. The audio must take around 45 to 60 seconds maximum per story.
            - Write in a highly natural, conversational spoken style. Use commas (,) frequently for natural pauses.
            - First paragraph of the FIRST story (World News) MUST start with exactly: "${greeting}"
            - DO NOT add any extra greetings or sign-offs other than the one specified.
            
            Reply ONLY with a valid JSON array. DO NOT use markdown blocks like \`\`\`json.
            Format EXACTLY like this:
            [ 
              { "category": "ကမ္ဘာအရေး", "headline": "Headline 1", "paragraphs": ["${greeting} Paragraph 1...", "Paragraph 2..."] },
              { "category": "နည်းပညာ", "headline": "Headline 2", "paragraphs": ["..."] },
              { "category": "အားကစား", "headline": "Headline 3", "paragraphs": ["..."] },
              { "category": "စမတ်ဖုန်း", "headline": "Headline 4", "paragraphs": ["..."] },
              { "category": "ငွေကြေး", "headline": "Headline 5", "paragraphs": ["..."] }
            ]`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                tools: [{ "google_search": {} }],
                generationConfig: { temperature: 0.3 } 
            };

            const urlBase = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`;
            const res = await fetchWithRetry(urlBase, payload);
            const data = await res.json();
            let text = data.candidates[0].content.parts[0].text;
            
            const jsonMatch = text.match(/\[\s*\{[\s\S]*\}\s*\]/);
            if (jsonMatch) {
                try {
                    newsItems = JSON.parse(jsonMatch[0]);
                } catch(e) { throw new Error("AI မှ တင်ဆက်မှုပုံစံ မှားယွင်းနေပါသည်။ (JSON Parsing Error)"); }
            } else {
                throw new Error("AI failed to output proper JSON format.");
            }
        }

        async function fetchImage(prompt) {
            try {
                const payload = { instances: { prompt: prompt }, parameters: { sampleCount: 1, aspectRatio: "9:16" } };
                const urlBase = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict`;
                
                const res = await fetchWithRetry(urlBase, payload, 3);
                const data = await res.json();
                if (data.predictions && data.predictions[0]) return `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
            } catch(e) {}
            return null; 
        }

        async function fetchAudio(text, language) {
            try {
                const payload = {
                    contents: [{ parts: [{ text: text }] }],
                    generationConfig: { 
                        responseModalities: ["AUDIO"], 
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } 
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };
                const urlBase = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent`;
                
                const res = await fetchWithRetry(urlBase, payload);
                const data = await res.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].inlineData) {
                    const inlineData = data.candidates[0].content.parts[0].inlineData;
                    const sampleRate = parseInt(inlineData.mimeType.match(/rate=(\d+)/)?.[1] || 24000);
                    return URL.createObjectURL(pcmToWav(inlineData.data, sampleRate));
                }
            } catch(e) { console.warn("TTS Error", e); }
            
            // Public Google Translate Fallback
            const langMap = { 'Burmese': 'my', 'English': 'en', 'Korean': 'ko', 'Japanese': 'ja', 'Thai': 'th' };
            const tl = langMap[language] || 'en';
            return `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text.substring(0, 195))}&tl=${tl}&client=tw-ob`;
        }

        function pcmToWav(pcmBase64, sampleRate) {
            const binaryString = atob(pcmBase64);
            const pcmData = new Int16Array(binaryString.length / 2);
            for (let i = 0; i < binaryString.length; i += 2) pcmData[i / 2] = binaryString.charCodeAt(i) | (binaryString.charCodeAt(i + 1) << 8);
            const wavBuffer = new ArrayBuffer(44 + pcmData.byteLength); const view = new DataView(wavBuffer);
            const writeString = (v, offset, str) => { for (let i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + pcmData.byteLength, true); writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(view, 36, 'data');
            view.setUint32(40, pcmData.byteLength, true);
            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);
            return new Blob([view], { type: 'audio/wav' });
        }

        // ==== AUDIO SYNC ====
        async function setupDurationsAndSubtitles() {
            totalDuration = 0;
            for(let item of newsItems) {
                if(item.audioUrl) {
                    const tempAudio = new Audio(item.audioUrl);
                    await new Promise(r => { 
                        tempAudio.onloadedmetadata = () => { 
                            if(tempAudio.duration === Infinity || isNaN(tempAudio.duration)) {
                                tempAudio.currentTime = 1e101;
                                tempAudio.ontimeupdate = () => {
                                    tempAudio.ontimeupdate = () => {};
                                    tempAudio.currentTime = 0;
                                    item.duration = tempAudio.duration;
                                    totalDuration += tempAudio.duration;
                                    r();
                                }
                            } else {
                                item.duration = tempAudio.duration; 
                                totalDuration += tempAudio.duration; 
                                r(); 
                            }
                        };
                        tempAudio.onerror = () => { item.duration = 5; totalDuration += 5; r(); }; 
                    });

                    const fullTextForAudio = item.headline + item.paragraphs.join("");
                    const totalChars = fullTextForAudio.length;
                    
                    item.subtitles = [];
                    let accumulatedTime = 0;

                    const headlineTime = (item.headline.length / totalChars) * item.duration;
                    item.subtitles.push({ text: "...", start: 0, end: headlineTime });
                    accumulatedTime += headlineTime;

                    item.paragraphs.forEach(p => {
                        const words = p.split(/(?<=[။၊\.\,])/); 
                        let currentChunk = ""; let chunks = [];
                        words.forEach(w => {
                            if(currentChunk.length + w.length > 150) { 
                                if(currentChunk) chunks.push(currentChunk.trim()); 
                                currentChunk = w; 
                            } else {
                                currentChunk += w;
                            }
                        });
                        if(currentChunk) chunks.push(currentChunk.trim());

                        const pTimeTotal = (p.length / totalChars) * item.duration;
                        const timePerChar = pTimeTotal / p.length;

                        chunks.forEach(c => {
                            const chunkTime = c.length * timePerChar;
                            item.subtitles.push({ text: c, start: accumulatedTime, end: accumulatedTime + chunkTime });
                            accumulatedTime += chunkTime;
                        });
                    });
                }
            }
            document.getElementById('timeTotal').innerText = formatTime(totalDuration);
        }

        // ==== PLAY & RECORD LOGIC ====
        function initAudioAnalyzer() {
            if(!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyzer = audioContext.createAnalyser(); analyzer.fftSize = 256;
                    const source = audioContext.createMediaElementSource(audioPlayer);
                    source.connect(analyzer); analyzer.connect(audioContext.destination);
                    dataArray = new Uint8Array(analyzer.frequencyBinCount);
                } catch (e) {
                    console.error("Audio Context Init Error:", e);
                }
            }
        }

        // Play/Pause
        btnPlayOnly.addEventListener('click', async () => {
            if (!newsItems.length || isRecording) return;
            
            try {
                if (!audioContext) initAudioAnalyzer();
                if (audioContext && audioContext.state === 'suspended') await audioContext.resume();
            } catch(e) { }

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playIcon.classList.replace('fa-pause', 'fa-play');
                playText.innerText = "Play Video";
                cancelAnimationFrame(animationFrameId);
            } else {
                isRecording = false;
                btnPlayAndRecord.disabled = true;
                
                if (audioPlayer.currentTime === 0 && currentNewsIndex === 0 && (!audioPlayer.src || audioPlayer.src === window.location.href)) {
                    audioPlayer.src = newsItems[currentNewsIndex].audioUrl;
                }
                
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playIcon.classList.replace('fa-play', 'fa-pause');
                    playText.innerText = "Pause";
                    renderLoop();
                }).catch(e => console.error(e));
            }
        });

        // Stop
        btnStop.addEventListener('click', () => {
            if (!newsItems.length) return;
            stopPlayback();
            if(isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            playIcon.classList.replace('fa-pause', 'fa-play');
            playText.innerText = "Play Video";
            btnPlayOnly.disabled = false;
            btnPlayAndRecord.disabled = false;
            isRecording = false;
            document.getElementById('recordingStatus').classList.add('hidden');
        });

        // Seek (Scrub)
        let isDragging = false;
        progressTrack.addEventListener('mousedown', (e) => { isDragging = true; seekAudio(e); });
        window.addEventListener('mouseup', () => isDragging = false);
        progressTrack.addEventListener('mousemove', (e) => { if (isDragging) seekAudio(e); });
        progressTrack.addEventListener('touchstart', (e) => { isDragging = true; seekAudio(e.touches[0]); });
        window.addEventListener('touchend', () => isDragging = false);
        progressTrack.addEventListener('touchmove', (e) => { if (isDragging) seekAudio(e.touches[0]); });

        function seekAudio(e) {
            if (!newsItems.length || totalDuration === 0 || isRecording) return; 
            const rect = progressTrack.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            if (clickX < 0) clickX = 0;
            if (clickX > rect.width) clickX = rect.width;
            
            const targetTime = (clickX / rect.width) * totalDuration;
            
            let accumulated = 0;
            let targetIndex = 0;
            let localTime = 0;

            for (let i = 0; i < newsItems.length; i++) {
                if (targetTime <= accumulated + newsItems[i].duration) {
                    targetIndex = i;
                    localTime = targetTime - accumulated;
                    break;
                }
                accumulated += newsItems[i].duration;
            }

            const wasPlaying = isPlaying;
            if (targetIndex !== currentNewsIndex) {
                currentNewsIndex = targetIndex;
                audioPlayer.src = newsItems[currentNewsIndex].audioUrl;
            }
            
            if (audioPlayer.readyState >= 1) {
                audioPlayer.currentTime = localTime;
            } else {
                const onLoaded = function() {
                    audioPlayer.currentTime = localTime;
                    audioPlayer.removeEventListener('loadedmetadata', onLoaded);
                };
                audioPlayer.addEventListener('loadedmetadata', onLoaded);
            }
            
            if (wasPlaying && audioPlayer.paused) {
                audioPlayer.play().catch(e => console.log(e));
            }
            
            drawCanvasFrame(performance.now() / 1000, localTime, 0);
            document.getElementById('timeCurrent').innerText = formatTime(targetTime);
            document.getElementById('playbackProgress').style.width = `${(targetTime / totalDuration) * 100}%`;
        }

        // Record to MP4 FORMAT
        btnPlayAndRecord.addEventListener('click', async () => {
            if (!newsItems.length || isRecording) return;
            try {
                if (!audioContext) initAudioAnalyzer();
                if (audioContext && audioContext.state === 'suspended') await audioContext.resume();
            } catch(e){}

            const resHeight = parseInt(resolutionSelect.value);
            const resWidth = Math.floor(resHeight * (9/16)); 
            document.getElementById('videoCanvas').width = resWidth; 
            document.getElementById('videoCanvas').height = resHeight;

            isRecording = true; recordedChunks = [];
            btnPlayOnly.disabled = true;
            btnPlayAndRecord.disabled = true; 
            document.getElementById('recordingStatus').classList.remove('hidden');
            document.getElementById('recordingText').innerText = '● Recording Broadcast';
            
            try {
                let combinedStream;
                const canvasStream = document.getElementById('videoCanvas').captureStream(30);
                
                if (audioContext && analyzer) {
                    const dest = audioContext.createMediaStreamDestination(); 
                    analyzer.connect(dest); 
                    combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
                } else {
                    combinedStream = canvasStream; 
                }
                
                // Set mimeType to MP4 
                let options = { mimeType: 'video/webm; codecs=vp8,opus' };
                if (MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.424028, mp4a.40.2"')) {
                    options = { mimeType: 'video/mp4; codecs="avc1.424028, mp4a.40.2"' };
                } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                    options = { mimeType: 'video/mp4' };
                }

                mediaRecorder = new MediaRecorder(combinedStream, options);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                
                mediaRecorder.onstop = () => {
                    const format = options.mimeType.includes('mp4') ? 'mp4' : 'mp4'; // Always name mp4
                    const blob = new Blob(recordedChunks, { type: options.mimeType });
                    const url = URL.createObjectURL(blob); 
                    const a = document.createElement('a'); document.body.appendChild(a);
                    a.style = 'display: none'; a.href = url;
                    a.download = `D_News_${languageSelect.value}_Broadcast_${new Date().getTime()}.${format}`;
                    a.click(); window.URL.revokeObjectURL(url);
                    
                    document.getElementById('recordingStatus').classList.add('hidden');
                    btnPlayAndRecord.disabled = false;
                    btnPlayOnly.disabled = false;
                    playIcon.classList.replace('fa-pause', 'fa-play');
                    playText.innerText = "Play Video";
                    isRecording = false; 
                    document.getElementById('videoCanvas').width = 720; document.getElementById('videoCanvas').height = 1280; 
                    drawCanvasFrame(0);
                };

                mediaRecorder.start(); 
                currentNewsIndex = 0;
                audioPlayer.src = newsItems[currentNewsIndex].audioUrl;
                audioPlayer.play().then(() => {
                    isPlaying = true; renderLoop();
                });

            } catch (err) { 
                showErrorLog("Recording Error: Your browser may not support canvas capturing or this video codec format.");
                document.getElementById('recordingStatus').classList.add('hidden'); 
                isRecording = false; 
                btnPlayAndRecord.disabled = false; 
                btnPlayOnly.disabled = false;
            }
        });

        audioPlayer.onended = () => {
            currentNewsIndex++; 
            if (currentNewsIndex < newsItems.length) {
                audioPlayer.src = newsItems[currentNewsIndex].audioUrl;
                audioPlayer.play().then(() => { isPlaying = true; });
            } else {
                stopPlayback(); 
                if(isRecording && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            }
        };

        function stopPlayback() {
            audioPlayer.pause(); isPlaying = false; audioPlayer.currentTime = 0;
            cancelAnimationFrame(animationFrameId);
            document.getElementById('playbackProgress').style.width = '0%';
            document.getElementById('timeCurrent').innerText = "00:00";
            
            if(!isRecording) {
                playIcon.classList.replace('fa-pause', 'fa-play');
                playText.innerText = "Play Video";
                btnPlayOnly.disabled = false;
                btnPlayAndRecord.disabled = false;
            }
            if (newsItems.length > 0) drawCanvasFrame(0);
        }

        function renderLoop() {
            if (!isPlaying) return;
            let volume = 0;
            if (analyzer && dataArray) {
                analyzer.getByteFrequencyData(dataArray);
                let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                volume = sum / dataArray.length; 
            }
            drawCanvasFrame(performance.now() / 1000, audioPlayer.currentTime, volume);
            
            let overallTime = 0;
            for(let i=0; i<currentNewsIndex; i++) overallTime += (newsItems[i].duration || 0);
            overallTime += audioPlayer.currentTime;
            
            document.getElementById('timeCurrent').innerText = formatTime(overallTime);
            document.getElementById('playbackProgress').style.width = `${(overallTime / totalDuration) * 100}%`;
            
            animationFrameId = requestAnimationFrame(renderLoop);
        }

        // ==== CANVAS RENDER (CNN/BBC STYLE LOGO) ====
        function drawCanvasFrame(timeInSeconds, currentAudioTime = 0, volume = 0) {
            const width = document.getElementById('videoCanvas').width;
            const height = document.getElementById('videoCanvas').height;
            const item = newsItems[currentNewsIndex];

            canvasContext.clearRect(0, 0, width, height);
            
            if (anchorImageObj) {
                const scale = Math.max(width / anchorImageObj.width, height / anchorImageObj.height);
                const finalScale = scale * (1 + (Math.sin(timeInSeconds * 0.3) * 0.015)); 
                const volumeYShift = (volume / 255) * 4; 
                
                const scaledWidth = anchorImageObj.width * finalScale;
                const scaledHeight = anchorImageObj.height * finalScale;
                const offsetX = (width - scaledWidth) / 2;
                const offsetY = (height - scaledHeight) / 2 + volumeYShift;
                
                canvasContext.drawImage(anchorImageObj, offsetX, offsetY, scaledWidth, scaledHeight);
            } else {
                const bgGradient = canvasContext.createRadialGradient(width/2, height/2, width*0.1, width/2, height/2, height);
                bgGradient.addColorStop(0, '#7f1d1d'); 
                bgGradient.addColorStop(1, '#020617'); 
                canvasContext.fillStyle = bgGradient; canvasContext.fillRect(0,0,width,height);
                
                canvasContext.strokeStyle = 'rgba(255, 255, 255, 0.1)'; canvasContext.lineWidth = 1.5;
                const offset = (timeInSeconds * 15) % 50;
                for(let i=-50; i<width; i+=50) { canvasContext.beginPath(); canvasContext.moveTo(i + offset,0); canvasContext.lineTo(i + offset,height); canvasContext.stroke(); }
                for(let i=0; i<height; i+=50) { canvasContext.beginPath(); canvasContext.moveTo(0,i); canvasContext.lineTo(width,i); canvasContext.stroke(); }
            }

            const logoX = width * 0.05;
            const logoY = height * 0.04;
            const logoBoxH = height * 0.045; 
            const logoBoxW = logoBoxH * 1.2;

            canvasContext.shadowColor = 'rgba(0,0,0,0.5)'; canvasContext.shadowBlur = 8;
            
            canvasContext.fillStyle = '#cc0000'; 
            canvasContext.fillRect(logoX, logoY, logoBoxW, logoBoxH);
            
            canvasContext.fillStyle = 'white'; 
            canvasContext.font = `900 ${logoBoxH * 0.8}px Montserrat, sans-serif`; 
            canvasContext.textAlign = 'center'; 
            canvasContext.textBaseline = 'middle'; 
            canvasContext.fillText("D", logoX + (logoBoxW/2), logoY + (logoBoxH/2) + 2);
            
            canvasContext.textAlign = 'left'; 
            canvasContext.font = `900 ${logoBoxH * 0.8}px Montserrat, sans-serif`; 
            canvasContext.fillText("NEWS", logoX + logoBoxW + 6, logoY + (logoBoxH/2) + 2);
            canvasContext.shadowBlur = 0;
            
            canvasContext.fillStyle = '#ef4444'; canvasContext.font = `bold ${height * 0.02}px sans-serif`; canvasContext.textAlign = 'right';
            if (Math.floor(timeInSeconds * 2) % 2 === 0) canvasContext.fillText("● LIVE", width * 0.95, height * 0.06);

            const textBgHeight = height * 0.45, textBgY = height - textBgHeight;
            const textBgGradient = canvasContext.createLinearGradient(0, textBgY, 0, height);
            textBgGradient.addColorStop(0, 'rgba(0, 0, 0, 0)'); textBgGradient.addColorStop(0.2, 'rgba(0, 0, 0, 0.9)'); textBgGradient.addColorStop(1, 'rgba(0, 0, 0, 1)');
            canvasContext.fillStyle = textBgGradient; canvasContext.fillRect(0, textBgY, width, textBgHeight);

            if (dataArray && isPlaying) {
                const barWidth = width / 30; canvasContext.fillStyle = 'rgba(239, 68, 68, 0.4)'; 
                for(let i=0; i<30; i++) {
                    const barHeight = (dataArray[i*2] || 0) * 0.6; 
                    canvasContext.fillRect(i * barWidth, textBgY + (height*0.1) - barHeight, barWidth - 2, barHeight);
                }
            }

            if (item) {
                let subText = "";
                if (item.subtitles) {
                    for (let sub of item.subtitles) {
                        if (currentAudioTime >= sub.start && currentAudioTime <= sub.end) { subText = sub.text; break; }
                    }
                }
                const contentX = width * 0.06, maxWidth = width * 0.88;
                
                canvasContext.textAlign = 'left'; canvasContext.fillStyle = '#cc0000'; 
                const catStr = item.category ? item.category.toUpperCase() : "BREAKING";
                canvasContext.font = `bold ${height * 0.018}px sans-serif`;
                const catW = canvasContext.measureText(catStr).width + 24, catH = height * 0.035, catY = textBgY + (height * 0.1);
                canvasContext.fillRect(contentX, catY, catW, catH);
                canvasContext.fillStyle = 'white'; canvasContext.textBaseline = 'middle';
                canvasContext.fillText(catStr, contentX + 12, catY + (catH/2) + 2);

                canvasContext.fillStyle = '#ffffff';
                const isBurmese = languageSelect.value === 'Burmese';
                const hlFontSize = isBurmese ? height * 0.032 : height * 0.028;
                canvasContext.font = `bold ${hlFontSize}px Padauk, sans-serif`; canvasContext.textBaseline = 'top';
                const subY = wrapTextWordBoundary(canvasContext, item.headline, contentX, catY + catH + 15, maxWidth, hlFontSize * 1.4);
                
                canvasContext.fillStyle = '#e2e8f0'; 
                const subFontSize = isBurmese ? height * 0.026 : height * 0.022;
                canvasContext.font = `bold ${subFontSize}px Padauk, sans-serif`;
                wrapTextWordBoundary(canvasContext, subText, contentX, subY + 20, maxWidth, subFontSize * 1.5);
            }
        }

        function wrapTextWordBoundary(ctx, text, x, y, maxWidth, lineHeight) {
            if(!text) return y;
            let segments = [];
            
            if (window.Intl && Intl.Segmenter) {
                const segmenter = new Intl.Segmenter('my', { granularity: 'word' });
                segments = Array.from(segmenter.segment(text)).map(s => s.segment);
            } else {
                segments = text.split(/(?=[ \n])|(?<=[ \n])/);
            }
            
            let line = '', currentY = y;
            for (let n = 0; n < segments.length; n++) {
                let testLine = line + segments[n]; 
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0 && line.trim() !== '') { 
                    ctx.fillText(line.trim(), x, currentY); 
                    line = segments[n]; 
                    currentY += lineHeight; 
                } else {
                    line = testLine;
                }
            }
            if (line.trim() !== '') ctx.fillText(line.trim(), x, currentY); 
            return currentY + lineHeight;
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity || seconds < 0) return "00:00";
            const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
    </script>
